name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone executable
        shell: pwsh
        run: ./build.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ArdorBatteryTray
          path: ArdorBatteryTray.exe
